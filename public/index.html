<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/index.css" />
    <title>Document</title>
  </head>
  <body>
    <form
      class="upload-form"
      action="/compress"
      method="POST"
      enctype="multipart/form-data"
    >
      <div class="form-group">
        <label for="file-input">Choose file for compression:</label>
        <input type="file" id="file-input" name="file" required />
      </div>

      <div class="form-group">
        <label for="compression-type">Compression type:</label>
        <select id="compression-type" name="compressionType">
          <option value="standard">gzip</option>
          <option value="high">deflate</option>
          <option value="fast">br</option>
        </select>
      </div>

      <button type="submit">Compress the file</button>
    </form>
  </body>
</html>
