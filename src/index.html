<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Compressor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }

    form {
      max-width: 400px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border-radius: 8px;
    }

    input,
    select,
    button {
      width: 100%;
      margin-bottom: 16px;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      border: none;
      border-radius: 4px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }
  </style>
</head>

<body>
  <form action="/compress" method="POST" enctype="multipart/form-data">
    <input type="file" name="file" />

    <select name="compressionType">
      <option value="gzip">gzip</option>
      <option value="deflate">deflate</option>
      <option value="br">br</option>
    </select>

    <button type="submit">Compress</button>
  </form>
</body>

</html>
